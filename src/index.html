    <!-- Desativado enquanto a barra de acessibilidade estiver oculta (BARRA_ACESSIBILIDADE_VISIVEL em site-header.ts); reative junto com ela.
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('zas-acessibilidade') || '{}');
        var r = document.documentElement;
        if (p.contraste) r.classList.add('alto-contraste');
        if (p.texto) r.style.setProperty('--tamanho-texto', p.texto + '%');
      } catch (e) {}
    </script>
    -->
    <!-- Chat de atendimento (fornecedor externo): entra assim que o HTML é lido, sem esperar fotos e fontes, e sem bloquear a página. -->
    <script>
      (function () {
        function carregarChat() {
          var s = document.createElement('script');
          s.src = '/chat/widget-channel.js';
          s.async = true;
          document.body.appendChild(s);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', carregarChat);
        else carregarChat();
      })();
    </script>
