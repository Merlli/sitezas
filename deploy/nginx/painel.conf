map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Painel. Quando o site entrar no compose, o server dele inclui
# bloquear-api.conf do mesmo jeito. Sem esse include, a entrega está errada.

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    include /etc/nginx/bloquear-api.conf;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_directus directus:8055;
        proxy_pass http://$upstream_directus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
