# Obrigatório em todo server público deste proxy, dentro do bloco server.
# A revalidação do cache escuta em site:4000, na rede interna do Docker.
# Este bloco impede que a internet chegue nela pelo proxy.

location /api/ {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 404 "Nao encontrado\n";
}
